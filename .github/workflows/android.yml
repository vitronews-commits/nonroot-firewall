name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit, transport integration, lint and APK builds
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleAndroidTest :probe:assembleDebug --stacktrace
      - name: Verify APK integrity and debug signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: nonroot-firewall-apks
          path: |
            app/build/outputs/apk/
            probe/build/outputs/apk/debug/
          if-no-files-found: error
  instrumentation:
    name: Android API ${{ matrix.api-level }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated host DNS and transport fixtures
        run: |
          sudo python3 -u tools/echo_server.py > /tmp/firewall-echo.log 2>&1 &
          python3 tools/test_echo_fixtures.py
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 127.0.0.1
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            mkdir -p app/build/acceptance-reports/offline
            cp -R app/build/outputs/androidTest-results app/build/acceptance-reports/offline/
            gradle :probe:assembleDebug --stacktrace
            adb install -r -t probe/build/outputs/apk/debug/probe-debug.apk
            adb shell am instrument -w -e mode direct_socket com.nonroot.firewall.probe/.ProbeInstrumentation > /tmp/direct-socket.txt
            grep 'status=OK' /tmp/direct-socket.txt
            adb shell am instrument -w -e mode direct_channel com.nonroot.firewall.probe/.ProbeInstrumentation > /tmp/direct-channel.txt
            grep 'status=OK' /tmp/direct-channel.txt
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.vpnAcceptance=true -Pandroid.testInstrumentationRunnerArguments.loadAcceptance=true -Pandroid.testInstrumentationRunnerArguments.class=com.nonroot.firewall.VpnAcceptanceTest --stacktrace
            python3 tools/verify_vpn_results.py app/build/outputs/androidTest-results/connected/debug
            python3 tools/verify_load_results.py app/build/outputs/androidTest-results/connected/debug
            if [ "${{ matrix.api-level }}" = "35" ]; then python3 tools/check_lockdown.py; fi
      - name: Preserve host and direct-control diagnostics
        if: always()
        run: |
          mkdir -p app/build/acceptance-reports/host
          cp /tmp/firewall-echo.log /tmp/direct-socket.txt /tmp/direct-channel.txt app/build/acceptance-reports/host/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-results-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/acceptance-reports/
  soak:
    name: Android API 35 - 60 minute TUN soak
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated host DNS and transport fixtures
        run: |
          sudo python3 -u tools/echo_server.py > /tmp/firewall-echo.log 2>&1 &
          python3 tools/test_echo_fixtures.py
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 127.0.0.1
          script: |
            gradle :app:connectedDebugAndroidTest :probe:assembleDebug --stacktrace
            adb install -r -t probe/build/outputs/apk/debug/probe-debug.apk
            adb shell am instrument -w -e mode direct_socket com.nonroot.firewall.probe/.ProbeInstrumentation > /tmp/direct-socket.txt
            grep 'status=OK' /tmp/direct-socket.txt
            adb shell am instrument -w -e mode direct_channel com.nonroot.firewall.probe/.ProbeInstrumentation > /tmp/direct-channel.txt
            grep 'status=OK' /tmp/direct-channel.txt
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.vpnAcceptance=true -Pandroid.testInstrumentationRunnerArguments.soakAcceptance=true -Pandroid.testInstrumentationRunnerArguments.class=com.nonroot.firewall.VpnAcceptanceTest -Pandroid.testInstrumentationRunnerArguments.timeout_msec=4500000 --stacktrace
            python3 tools/verify_vpn_results.py app/build/outputs/androidTest-results/connected/debug
            python3 tools/verify_load_results.py app/build/outputs/androidTest-results/connected/debug --soak
      - name: Preserve soak fixture diagnostics
        if: always()
        run: |
          mkdir -p app/build/acceptance-reports/host
          cp /tmp/firewall-echo.log /tmp/direct-socket.txt /tmp/direct-channel.txt app/build/acceptance-reports/host/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-api-35
          path: |
            app/build/acceptance-reports/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
