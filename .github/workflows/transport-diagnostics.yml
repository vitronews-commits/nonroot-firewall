name: Inspect transport failure artifacts
on:
  push:
    branches: [development/daily-use]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print preserved independent controls and synthetic fixture diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41816279576 --repo vitronews-commits/nonroot-firewall --name instrumentation-results-api-29 --dir reports29
          gh run download 41816279576 --repo vitronews-commits/nonroot-firewall --name instrumentation-results-api-35 --dir reports35
          python3 - <<'PY'
          from pathlib import Path
          for root in (Path("reports29"), Path("reports35")):
              for path in root.rglob("*"):
                  if path.is_file() and path.name in ("direct-socket.txt","direct-channel.txt","firewall-echo.log"):
                      print(str(path))
                      print("\n".join(path.read_text(errors="replace").splitlines()[-40:]))
          PY
